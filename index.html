<style>
:root{--ink:#10243a;--muted:#55677a;--paper:#f7f9fb;--line:#d5dde5;--teal:#0b7a75;--teal-d:#085c58;--sand:#e9f2f1;--err:#b3261e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 "IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,Arial,sans-serif}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",Arial,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.lang{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.lang:hover{border-color:var(--teal)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.hero{background:var(--ink);color:#fff;padding:20px 0 64px;position:relative;overflow:hidden;
 background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.3px);background-size:26px 26px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(90deg,var(--teal),#f2b705)}
.hero .wrap{position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:10px;margin:36px 0 18px;padding:6px 14px;border:1px solid #3d566e;border-radius:99px;font-size:15px;color:#d8e4ee}
.badge i{width:9px;height:9px;border-radius:50%;background:#3ddc97;box-shadow:0 0 0 4px rgba(61,220,151,.2)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:34px 0 0;padding:0;list-style:none}
.chips a{display:block;padding:8px 16px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid #3d566e;color:#fff;text-decoration:none;font-size:16px}
.chips a:hover{background:rgba(255,255,255,.16);border-color:#8fb0cc}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 0 32px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;padding:0 20px;border-inline-start:3px solid var(--teal)}
.steps li::before{content:counter(s);display:block;font-size:30px;font-weight:700;color:var(--teal);line-height:1.2}
.steps b{display:block}
.steps span{color:var(--muted);font-size:15px}
.intro{font-size:20px;max-width:680px;margin:0 0 8px}
.hero h1{margin:0 0 18px;font-size:clamp(38px,8vw,68px);line-height:1.12;font-weight:700;letter-spacing:-.01em;max-width:820px}
.hero p{margin:0 0 30px;max-width:600px;color:#c6d3df;font-size:20px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 24px;border-radius:6px;font-size:17px;font-weight:500;font-family:inherit;line-height:1.4;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn.main{background:#f2b705;color:#10243a;font-weight:700}
.btn.main:hover{background:#ffcb2e}
.btn.ghost{border-color:#5d7389;color:#fff}
.btn.ghost:hover{border-color:#fff}
.btn.send{background:var(--teal);color:#fff;width:100%;margin-top:8px}
.btn.send:hover{background:var(--teal-d)}
h2{font-size:28px;margin:0 0 6px;line-height:1.3}
section.wrap{padding:52px 20px}
.hero h1,.intro{text-wrap:balance}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:8px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:10px;padding:26px 26px 22px;display:flex;flex-direction:column;scroll-margin-top:20px;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 10px 28px rgba(16,36,58,.10);transform:translateY(-2px)}
.card:target{box-shadow:0 0 0 3px #f2b705}
.ch{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ic{flex:none;width:48px;height:48px;border-radius:10px;background:var(--sand);color:var(--teal);display:grid;place-items:center}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:20px;line-height:1.3}
.tag{display:inline-block;margin:8px 0 14px;padding:2px 12px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;align-self:flex-start}
.card h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang=ar] .card h4{letter-spacing:0;text-transform:none;font-size:15px}
.card ul{list-style:none;margin:0 0 16px;padding:0}
.card li{position:relative;padding-inline-start:26px;margin-bottom:7px;font-size:16px;line-height:1.55}
.card li::before{content:"";position:absolute;inset-inline-start:0;top:.45em;width:12px;height:7px;border-inline-start:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);transform:rotate(-45deg)}
.plus{margin:auto 0 16px;padding:10px 14px;background:#fff8e1;border-inline-start:4px solid #f2b705;border-radius:4px;font-size:15px}
.card .btn{text-align:center;padding:10px 20px;font-size:16px;background:var(--ink);color:#fff}
.card .btn:hover{background:var(--teal)}
.all{margin-top:20px;color:var(--muted)}
.apply{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
form{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.full{grid-column:1/-1}
label{display:block;font-weight:500;font-size:16px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #9aa9b8;border-radius:6px;background:#fff;color:var(--ink)}
input[type=file]{padding:8px}
textarea{min-height:96px;resize:vertical}
input[dir=ltr]{text-align:start}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
#msg{grid-column:1/-1;margin:0;padding:12px 14px;border-radius:6px;display:none}
#msg.ok{display:block;background:var(--sand);color:var(--teal-d)}
#msg.bad{display:block;background:#fbeae9;color:var(--err)}
.contact{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:baseline}
.contact a{color:var(--ink);font-size:24px;font-weight:700;text-decoration:none;direction:ltr;unicode-bidi:embed}
.contact a:hover{color:var(--teal)}
footer.wrap{padding:28px 20px;color:var(--muted);font-size:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
@media(max-width:600px){.steps{grid-template-columns:1fr;gap:18px}form{grid-template-columns:1fr}.hero{padding:40px 0 44px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  var ok = f.name.value.trim() && f.phone.value.trim() && f.email.value && f.email.checkValidity() && f.role.value && f.cv.files.length;
  if(!ok){m.className="bad"; m.textContent=t.needs; return;}
  var file = f.cv.files[0];
  if(file.size > 4*1024*1024){m.className="bad"; m.textContent=t.big; return;}
  var roleName = roles.filter(function(r){return r.id===f.role.value})[0].en.t;

  if(SHEET_URL){
    btn.disabled = true; m.className="ok"; m.textContent=t.sending;
    toB64(file).then(function(b64){
      return fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({
        role:roleName,name:f.name.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),city:f.city.value.trim(),
        experience:f.exp.value,note:f.note.value.trim(),cvName:file.name,cvType:file.type,cvData:b64})});
    }).then(function(){m.className="ok"; m.textContent=t.sent; f.reset();})
      .catch(function(){m.className="bad"; m.textContent=t.fail;})
      .then(function(){btn.disabled=false});
    return;
  }
  var L = t.lbl, lines = [t.wh, "", L.role+": "+roleName, L.name+": "+f.name.value.trim(), L.phone+": "+f.phone.value.trim(), L.email+": "+f.email.value.trim()];
  if(f.city.value.trim()) lines.push(L.city+": "+f.city.value.trim());
  if(f.exp.value) lines.push(L.exp+": "+f.exp.value);
  if(f.note.value.trim()) lines.push(L.note+": "+f.note.value.trim());
  window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n")),"_blank","noopener");
  m.className="ok"; m.textContent=t.wapre;
});

$("#list").addEventListener("click",function(e){
  var a=e.target.closest("a[data-role]"); if(a) $("#role").value=a.dataset.role;
});
render();
